<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


</head>

<body>
    <center>
    <h1>pete's pizza Delivery</h1>
    <h2>online order From</h2>
    <h3><b>*</b> required field</h3>
    </center>
    
    <form action="">
        <fieldset>
            <table>
                <legend>custumer detail</legend>
                <tr>
                    <td>
                        <label for="name"><b>*</b>Name:</label>
                    </td>
                <td>
                
                <input type="text" name="name" id="name">
                </td>
                </tr>
        
                <tr>
                    <td>
                
                        <label for="address"><b>*</b>Address:</label>
                    </td>
                <td>
                     <input type="text" name="Address" id="Address">
                </td>
                </tr>

                <tr>

                <td>
                      <label for="Tel"><b>*</b>Tel:</label>
                    </td>
                    <td>
                         <input type="text" name="tel" id="tel">
                    </td>
                    </tr>

                    <tr>

                <td>
                      <label for="town/city"><b>*</b>Town/city:</label>
                    </td>
                    <td>
                         <input type="text" name="town/city" id="town/city">
                    </td>
                    </tr>

                    <tr>

                <td>
                      <label for="postcode"><b>*</b>postcode:</label>
                    </td>
                    <td>
                         <input type="text" name="postcode" id="postcode">
                    </td>
                    </tr>

                    <tr>

                <td>
                      <label for="Email"><b>*</b>Email:</label>
                    </td>
                    <td>
                         <input type="text" name="Email" id="Email">
                    </td>
                    </tr>
                    
            </table>

        </fieldset>
        <table>
            <tr>
                <td>
                    <fieldset>
                        <legend>Topping*</legend>
                        <input type="radio" id="mag1">
                        <label for="mag1">Margherita</label>
                        <br>

                        <input type="radio" id="mag2">
                        <label for="mag2">Four Seasons</label>
                        <br>

                        <input type="radio" id="mag3">
                        <label for="mag3">Meat Feast</label>
                    </fieldset>
                </td>
                <td>
                    <fieldset>
                        <legend>Size*</legend>
                        <input type="radio" id="mag4">
                        <label for="mag4">Small</label>
                        <br>

                        <input type="radio" id="mag5">
                        <label for="mag5">Medium</label>
                        <br>

                        <input type="radio" id="mag6">
                        <label for="mag6">Large</label>

                    </fieldset>
                </td>
                <td>
                    <fieldset>
                        <legend>Extras</legend>
                        <input type="checkbox" id="mag7">
                        <label for="mag7">Green peppers</label>
                        <br>

                        <input type="checkbox" id="mag8">
                        <label for="mag8">Anchovies</label>
                        <br>

                        <input type="checkbox" id="mag9">
                        <label for="mag9">Extra cheese</label>
                        <br>
                         <input type="checkbox" id="mag10">
                        <label for="mag10">Mushrooms</label>

                    </fieldset>
                </td>
            </tr>
        </table>
        <fieldset>
            <legend>Delivery</legend>
            <label for="preferred devivery time">preferred devivery time:</label>
            <input type="time" id="time">
            <br><br>
            <label for="Delivery instructions" >Delivery instructions:</label>
            <textarea placeholder=""></textarea>
        </fieldset>
    </form>
    <button><center>Submit order</center></button>


</body>

</html>
